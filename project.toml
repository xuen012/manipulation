[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "manipulation-diffusion-grasps"
version = "0.2.0"
description = "Project 2: conditional diffusion grasp sampling for TAMPanda"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "torch>=2.2", "matplotlib>=3.7"]

[project.optional-dependencies]
sim = ["tampanda @ git+https://github.com/snoato/TAMPanda.git@a48730f15feddb4f7bc6b4db3da46c28d131f872", "quadprog>=0.1.13"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["data*", "env*", "model*", "pddl*", "utils*", "experiments*"]

[tool.setuptools.package-data]
env = ["templates/*.xml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["sim: requires TAMPanda and MuJoCo"]
